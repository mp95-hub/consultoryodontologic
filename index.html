    // =========================================================================
    // CRIPTOGRAFÍA: hash de PIN (PBKDF2 + sal) y respaldos cifrados (AES-GCM)
    // =========================================================================
    const _enc = new TextEncoder();
    function b64(buf) {
      const u = new Uint8Array(buf);
      let s = '';
      for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
      return btoa(s);
    }
    function deB64(str) {
      const s = atob(str);
      const u = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
      return u;
    }

    let _sha = null;
    function sha256Bytes(msg) {
      if (!_sha) {
        const primos = [];
        for (let n = 2; primos.length < 64; n++) if (primos.every((p) => n % p)) primos.push(n);
        const frac = (x) => Math.floor((x - Math.floor(x)) * 4294967296);
        _sha = { K: primos.map((p) => frac(Math.cbrt(p))), H: primos.slice(0, 8).map((p) => frac(Math.sqrt(p))) };
      }
      const { K, H } = _sha;
      const l = msg.length;
      const pad = new Uint8Array(((l + 9 + 63) >> 6) << 6);
      pad.set(msg);
      pad[l] = 0x80;
      const dv = new DataView(pad.buffer);
      dv.setUint32(pad.length - 4, (l * 8) >>> 0);
      dv.setUint32(pad.length - 8, Math.floor((l * 8) / 4294967296));
      const h = H.slice();
      const w = new Uint32Array(64);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      for (let o = 0; o < pad.length; o += 64) {
        for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
        for (let i = 16; i < 64; i++) {
          const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
          const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
        }
        let [a, b, c, d, e, f, g, hh] = h;
        for (let i = 0; i < 64; i++) {
          const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
          const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
          const mj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + mj) | 0;
          hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        [a, b, c, d, e, f, g, hh].forEach((v, i) => (h[i] = (h[i] + v) | 0));
      }
      const out = new Uint8Array(32);
      const ov = new DataView(out.buffer);
      h.forEach((v, i) => ov.setUint32(i * 4, v >>> 0));
      return out;
    }
    function sha256Iterado(texto, salt, rondas) {
      const t = _enc.encode(texto);
      const ini = new Uint8Array(salt.length + t.length);
      ini.set(salt);
      ini.set(t, salt.length);
      let h = sha256Bytes(ini);
      for (let i = 1; i < rondas; i++) {
        const x = new Uint8Array(h.length + salt.length);
        x.set(h);
        x.set(salt, h.length);
        h = sha256Bytes(x);
      }
      return h;
    }

    const PBKDF2_ITER = 150000;
    async function derivarPBKDF2(texto, salt, iter) {
      const base = await crypto.subtle.importKey('raw', _enc.encode(texto), 'PBKDF2', false, ['deriveBits']);
      return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, 256));
    }
    async function hashPin(pin) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      if (crypto.subtle) return `pbkdf2$${PBKDF2_ITER}$${b64(salt)}$${b64(await derivarPBKDF2(pin, salt, PBKDF2_ITER))}`;
      return `sha256i$20000$${b64(salt)}$${b64(sha256Iterado(pin, salt, 20000))}`;
    }
    async function verificarPin(pin, almacenado) {
      if (!almacenado || typeof almacenado !== 'string') return false;
      const [alg, iterS, saltB, hashB] = almacenado.split('$');
      let h;
      try {
        const salt = deB64(saltB);
        const iter = Number(iterS);
        if (alg === 'pbkdf2') {
          if (!crypto.subtle) return false;
          h = await derivarPBKDF2(pin, salt, iter);
        } else if (alg === 'sha256i') h = sha256Iterado(pin, salt, iter);
        else return false;
        const esp = deB64(hashB);
        if (esp.length !== h.length) return false;
        let dif = 0;
        for (let i = 0; i < h.length; i++) dif |= h[i] ^ esp[i];
        return dif === 0;
      } catch (_) {
        return false;
      }
    }

    async function claveAES(clave, salt, iter, uso) {
      const base = await crypto.subtle.importKey('raw', _enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, [uso]);
    }
    async function cifrarRespaldo(textoPlano, clave) {
      if (!crypto.subtle) throw new Error('Este navegador no permite cifrar aquí. Abre la app con https, localhost o como archivo local.');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const iter = 250000;
      const key = await claveAES(clave, salt, iter, 'encrypt');
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, _enc.encode(textoPlano));
      return { formato: 'CPFOdonto-cifrado', version: 1, kdf: 'PBKDF2-SHA256', iter, salt: b64(salt), iv: b64(iv), datos: b64(ct) };
    }
    async function descifrarRespaldo(env, clave) {
      const key = await claveAES(clave, deB64(env.salt), Number(env.iter) || 250000, 'decrypt');
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(env.iv) }, key, deB64(env.datos));
      return new TextDecoder().decode(pt);
    }

    function registrarPagoPresupuesto(e, prId) {
      e.preventDefault();
      const pr = state.presupuestos.find((x) => x.id === prId);
      if (!pr) return;
      const ahora = Date.now();
      if (_ultimoPagoTs[prId] && ahora - _ultimoPagoTs[prId] < 2000) {
        alertMsg('Acabas de registrar un pago. Revisa el listado antes de repetirlo.', true);
        return;
      }
      const fd = new FormData(e.target);
      const montoCent = aCent(fd.get('monto'));
      const t = calcTotalesPres(pr);
      const saldoCent = t.totCent - pagadoCentPres(pr);
      if (saldoCent <= 0) return alertMsg('Este presupuesto ya está saldado.', true);
      if (montoCent <= 0) return alertMsg('Ingresa un monto mayor a 0.', true);
      if (montoCent > saldoCent) return alertMsg(`El monto supera el saldo pendiente (${fmtMoney(deCent(saldoCent))}).`, true);
      const metodo = METODOS_PAGO.includes(String(fd.get('metodo'))) ? String(fd.get('metodo')) : 'Efectivo';
      let fecha = String(fd.get('fecha') || '');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) fecha = hoyISO();
      const nota = String(fd.get('nota') || '').trim().slice(0, 120);

      // Reparto proporcional de materiales entre los pagos
      const costoTot = costoMaterialesPresCent(pr);
      const costoYa = pagosVigentes(pr).reduce((s, p) => s + (Number(p.costoCent) || 0), 0);
      let costoCent = montoCent === saldoCent ? costoTot - costoYa : Math.round((costoTot * montoCent) / (t.totCent || 1));
      costoCent = Math.max(0, Math.min(costoCent, costoTot - costoYa));

      const pac = state.pacientes.find((p) => p.id === pr.pacId);
      if (!Array.isArray(pr.pagos)) pr.pagos = [];
      if (!Array.isArray(state.cajaMovimientos)) state.cajaMovimientos = [];
      const pagoId = idUnico('pg');
      const movId = idUnico('mov');
      const nPago = pr.pagos.length + 1;
      pr.pagos.push({ id: pagoId, fecha, metodo, montoCent, costoCent, nota, movId, usuario: rolActual });
      state.cajaMovimientos.unshift({
        id: movId,
        fecha,
        pacId: pr.pacId,
        pacNombre: pac?.nombre || 'Paciente',
        concepto: `Cobro ${pr.num} · pago ${nPago}${nota ? ` (${nota})` : ''}`,
        tipo: 'ingreso',
        metodo,
        monto: deCent(montoCent),
        costoInsumos: deCent(costoCent),
        presupuestoId: pr.id,
        pagoId
      });

      // Solo pasa a Aprobado cuando se paga el 100 %
      const totalPagadoAhora = pagadoCentPres(pr);
      if (totalPagadoAhora >= t.totCent) {
        pr.estado = 'Aprobado';
      } else if (['Pendiente', 'Impreso', 'Enviado'].includes(pr.estado)) {
        pr.estado = 'En curso';
      }

      _ultimoPagoTs[prId] = ahora;
      addLog(`💰 Pago de ${fmtMoney(deCent(montoCent))} en ${pr.num} (${metodo})`);
      save();
      alertMsg(`Pago de ${fmtMoney(deCent(montoCent))} registrado. Saldo: ${fmtMoney(deCent(saldoCent - montoCent))}.`);
      render();
    }

async function anularPagoPresupuesto(prId, pagoId) {
      if (!esDoctor()) return alertMsg('Solo el profesional puede anular pagos.', true);
      const pr = state.presupuestos.find((x) => x.id === prId);
      const pg = pr?.pagos?.find((x) => x.id === pagoId);
      if (!pg || pg.anulado) return;
      const v = await abrirDialogo({
        titulo: 'Anular pago',
        mensaje: `Se anulará el pago de ${fmtMoney(deCent(pg.montoCent))} (${pg.fecha}, ${pg.metodo}) sin borrarlo del historial, y se revertirá su ingreso en Caja.`,
        campos: [{ id: 'motivo', label: 'Motivo de la anulación', requerido: true }],
        aceptar: 'Anular pago',
        peligro: true
      });
      if (!v) return;
      pg.anulado = true;
      pg.fechaAnulacion = hoyISO();
      pg.motivoAnulacion = v.motivo.trim();
      const mov = (state.cajaMovimientos || []).find((m) => m.id === pg.movId || m.pagoId === pagoId);
      if (mov) {
        mov.anulado = true;
        mov.motivoAnulacion = pg.motivoAnulacion;
      }

      // Si al anular deja de estar pagado al 100 %, revierte el estado Aprobado
      const totCent = calcTotalesPres(pr).totCent;
      const pagCent = pagadoCentPres(pr);
      if (pr.estado === 'Aprobado' && pagCent < totCent) {
        pr.estado = pagCent > 0 ? 'En curso' : 'Pendiente';
      }

      addLog(`↩ Pago anulado en ${pr.num}: ${fmtMoney(deCent(pg.montoCent))} (${pg.motivoAnulacion})`);
      save();
      alertMsg('Pago anulado y descontado de los totales de Caja.');
      render();
    }

      if (m.presupuestoId && m.pagoId) return anularPagoPresupuesto(m.presupuestoId, m.pagoId);

${

// ARRANQUE ASÍNCRONO CON INDEXEDDB Y MIGRACIÓN AUTOMÁTICA DESDE LOCALSTORAGE
// =========================================================================

const conTimeout = (promesa, ms = 2000) =>
      Promise.race([promesa, new Promise((_, rej) => setTimeout(() => rej(new Error('Tiempo de espera agotado en IndexedDB')), ms))]);

let bloquearCreacionPinPorError = false;
let errorAlmacenamientoArranque = '';
    let _sistemaIniciado = false;

    async function iniciarSistemaConIndexedDB() {
      if (_sistemaIniciado) return;
      _sistemaIniciado = true;

      const appEl = document.getElementById('app');
      if (appEl) {
        appEl.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-slate-100 text-slate-700 font-semibold text-sm">⏳ Cargando base de datos clínica...</div>`;
      }

      try {
        await conTimeout(abrirIndexedDB(), 15000);
        carpetaBackupHandle = await conTimeout(leerHandleCarpetaIDB(), 1000).catch(() => null);
        if (carpetaBackupHandle && typeof verificarPermisoCarpeta === 'function') {
          permisoCarpetaOk = await conTimeout(verificarPermisoCarpeta(carpetaBackupHandle, false), 1000).catch(() => false);
        }
        const estadoEnIDB = await conTimeout(leerEstadoIDB(), 15000);
        if (estadoEnIDB && Array.isArray(estadoEnIDB.pacientes)) {
          state = normalizarEstado(estadoEnIDB);
          try { localStorage.removeItem(KEY); } catch (_) {}
        } else {
          await conTimeout(escribirEstadoIDB(JSON.parse(JSON.stringify(state))), 15000);
          try { localStorage.removeItem(KEY); } catch (_) {}
        }
      } catch (err) {
        idbDisponible = false;
        bloquearCreacionPinPorError = true;
        errorAlmacenamientoArranque = '⚠️ Edge bloqueó IndexedDB en archivo local. Operando con respaldo localStorage (puedes descargar respaldo JSON cuando quieras).';
        console.warn('Fallback a localStorage:', err);
        try {
          const lsData = JSON.parse(localStorage.getItem(KEY));
          if (lsData && Array.isArray(lsData.pacientes)) {
            state = normalizarEstado(lsData);
          }
        } catch (_) {}
      }

      if (!bloquearCreacionPinPorError) {
  await asegurarSeguridad();
}
      bloqueado = Boolean((state.config.pinTemporal && !bloquearCreacionPinPorError) || state.config.bloquearInicio || state.config.pinRecepcionHash);
      pacActivoId = state.pacientes[0]?.id || '';
      presupuestoId = state.presupuestos[0]?.id || '';
      await conTimeout(actualizarEstadisticasAlmacenamiento(), 1000).catch(() => {});
solicitarCandadoEscritura();
render();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', iniciarSistemaConIndexedDB);
    } else {
      iniciarSistemaConIndexedDB();
    }

// =========================================================================
 // ACCESIBILIDAD GLOBAL: ARIA, ETIQUETAS AUTOMÁTICAS, TRAMPA DE FOCO Y ESC
 // =========================================================================
 let ultimoElementoConFoco = null;

 function mejorarAccesibilidadDOM() {
document.querySelectorAll('input, select, textarea').forEach((el, idx) => {
  if (el.type === 'hidden') return;
  if (!el.id) el.id = 'campo-a11y-' + idx;
  if (document.querySelector(`label[for="${el.id}"]`)) return;

  const labelPadre = el.closest('label');
  if (labelPadre) {
    labelPadre.setAttribute('for', el.id);
    return;
  }

  const prevLabel = el.parentElement?.querySelector('label');
  if (prevLabel && prevLabel.textContent.trim()) {
    prevLabel.setAttribute('for', el.id);
    if (!el.getAttribute('aria-label')) {
      el.setAttribute('aria-label', prevLabel.textContent.replace('*', '').trim());
    }
    return;
  }

  if (!el.getAttribute('aria-label')) {
    const textoAuto =
      el.getAttribute('placeholder') ||
      el.getAttribute('title') ||
      (el.tagName === 'SELECT' && el.options?.[0]?.text) ||
      el.name ||
      'Campo de formulario';
    el.setAttribute('aria-label', textoAuto.trim());
  }
});

   document.querySelectorAll('button').forEach((btn) => {
     if (btn.getAttribute('aria-label')) return;
     const txt = btn.textContent.trim();
     if (txt === '✕' || txt === '×') btn.setAttribute('aria-label', 'Cerrar ventana');
     else if (txt === '◀') btn.setAttribute('aria-label', 'Anterior');
     else if (txt === '▶') btn.setAttribute('aria-label', 'Siguiente');
     else if (txt === '−' || txt === '-') btn.setAttribute('aria-label', 'Disminuir');
     else if (txt === '+') btn.setAttribute('aria-label', 'Aumentar');
   });

   document.querySelectorAll('div.fixed.inset-0').forEach((modal, idx) => {
     if (modal.id === 'toast-box') return;
     modal.setAttribute('role', 'dialog');
     modal.setAttribute('aria-modal', 'true');
     const titulo = modal.querySelector('h2, h3, h4');
     if (titulo) {
       if (!titulo.id) titulo.id = 'modal-titulo-' + idx;
       modal.setAttribute('aria-labelledby', titulo.id);
     }
   });
 }

 function obtenerModalAbierto() {
   return Array.from(document.querySelectorAll('div.fixed.inset-0[role="dialog"]')).find(
     (m) => !m.classList.contains('hidden') && m.offsetParent !== null
   );
 }

 function cerrarModalActivo() {
   const modal = obtenerModalAbierto();
   if (modal) {
     const btnCerrar = Array.from(modal.querySelectorAll('button')).find((b) =>
       ['✕', '×', 'Cerrar', 'Cancelar'].includes(b.textContent.trim())
     );
     if (btnCerrar) btnCerrar.click();
     else modal.classList.add('hidden');
   } else if (typeof fotoAmpliada !== 'undefined' && fotoAmpliada) {
     fotoAmpliada = null;
     render();
   }
   if (ultimoElementoConFoco && typeof ultimoElementoConFoco.focus === 'function') {
     ultimoElementoConFoco.focus();
     ultimoElementoConFoco = null;
   }
 }

 document.addEventListener('keydown', (e) => {
   const modal = obtenerModalAbierto();
   if (e.key === 'Escape' && (modal || (typeof fotoAmpliada !== 'undefined' && fotoAmpliada))) {
     e.preventDefault();
     cerrarModalActivo();
     return;
   }
   if (e.key === 'Tab' && modal) {
     const enfocables = Array.from(
       modal.querySelectorAll('button:not([disabled]), input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')
     ).filter((el) => el.offsetParent !== null);
     if (!enfocables.length) return;
     const primero = enfocables[0];
     const ultimo = enfocables[enfocables.length - 1];
     if (e.shiftKey && document.activeElement === primero) {
       e.preventDefault();
       ultimo.focus();
     } else if (!e.shiftKey && document.activeElement === ultimo) {
       e.preventDefault();
       primero.focus();
     }
   }
 });

 if (typeof render === 'function' && !render._a11yWrapped) {
   const _renderOriginal = render;
   render = function () {
     const modalAntes = obtenerModalAbierto();
     if (!modalAntes && document.activeElement && document.activeElement !== document.body) {
       ultimoElementoConFoco = document.activeElement;
     }
     _renderOriginal.apply(this, arguments);
     mejorarAccesibilidadDOM();
     const modalDespues = obtenerModalAbierto();
     if (modalDespues && !modalAntes) {
       const primerCampo = modalDespues.querySelector('input:not([type="hidden"]), select, textarea, button');
       if (primerCampo) primerCampo.focus();
     }
   };
   render._a11yWrapped = true;
   mejorarAccesibilidadDOM();
 }

 new MutationObserver((muts) => {
   for (const m of muts) {
     if (m.type === 'attributes' && m.attributeName === 'class') {
       const el = m.target;
       if (el.matches('div.fixed.inset-0[role="dialog"]') && !el.classList.contains('hidden')) {
         if (document.activeElement && !el.contains(document.activeElement)) {
           ultimoElementoConFoco = document.activeElement;
         }
         const primerCampo = el.querySelector('input:not([type="hidden"]), select, textarea, button');
         if (primerCampo) setTimeout(() => primerCampo.focus(), 10);
       }
     }
   }
 }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });  
  </script>
