    // ---- Fechas en hora LOCAL (toISOString() usa UTC: en Montevideo, desde las 21:00 "hoy" ya era mañana) ----
    function fechaLocalISO(d = new Date()) {
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function fechaHoraLocalTexto(d = new Date()) {
      const p = (n) => String(n).padStart(2, '0');
      return `${fechaLocalISO(d)} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    const hoyISO = () => fechaLocalISO();
    const mananaISO = () => {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return fechaLocalISO(d);
    };

    // ---- Dinero: se calcula en centavos enteros para evitar errores de coma flotante ----
    function aCent(n) {
      const v = Number(n);
      return Number.isFinite(v) ? Math.round((v + Number.EPSILON) * 100) : 0;
    }
    function deCent(c) {
      return Math.round(Number(c) || 0) / 100;
    }
    function sumaDin(lista, fn) {
      return deCent((lista || []).reduce((s, x) => s + aCent(fn(x)), 0));
    }
    function idUnico(pref) {
      return `${pref}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
    }
    // Totales de un presupuesto (subtotal, descuento y total) en centavos y en unidades
    function calcTotalesPres(pr) {
      const items = Array.isArray(pr?.items) ? pr.items : [];
      const subCent = items.reduce((s, i) => s + aCent((Number(i.cant) || 0) * (Number(i.precio) || 0)), 0);
      const val = Number(pr?.descVal) || 0;
      let descCent = pr?.descTipo === 'porcentaje' ? Math.round((subCent * Math.min(100, Math.max(0, val))) / 100) : aCent(Math.max(0, val));
      descCent = Math.min(subCent, Math.max(0, descCent));
      const totCent = subCent - descCent;
      return { subCent, descCent, totCent, sub: deCent(subCent), desc: deCent(descCent), tot: deCent(totCent) };
    }
    // Reparte el total en cuotas exactas (los centavos sobrantes van a las primeras cuotas)
    function planCuotasCent(totCent, n) {
      n = Math.max(1, Math.floor(Number(n) || 1));
      const base = Math.floor(totCent / n);
      let resto = totCent - base * n;
      return Array.from({ length: n }, () => base + (resto-- > 0 ? 1 : 0));
    }
    function pagosVigentes(pr) {
      return (Array.isArray(pr?.pagos) ? pr.pagos : []).filter((p) => !p.anulado);
    }
    function pagadoCentPres(pr) {
      return pagosVigentes(pr).reduce((s, p) => s + (Number(p.montoCent) || 0), 0);
    }
    function estadoCobroPres(pr) {
      const t = calcTotalesPres(pr).totCent;
      const pg = pagadoCentPres(pr);
      if (pg <= 0) return 'Sin pagos';
      if (pg < t) return 'Parcial';
      return pg === t ? 'Pagado' : 'Pagado de más';
    }
    // Costo de materiales del presupuesto, en CENTAVOS
    function costoMaterialesPresCent(pr) {
      return (pr?.items || []).reduce((s, it) => s + (it.insumos || []).reduce((si, ins) => si + aCent((Number(ins.cant) || 0) * (Number(ins.costoUnit) || 0)), 0), 0);
    }
    // Convierte los cobros antiguos (un movimiento de caja por el total) en pagos del presupuesto
    function migrarPagosPresupuestos(st) {
      const movs = Array.isArray(st.cajaMovimientos) ? st.cajaMovimientos : [];
      (st.presupuestos || []).forEach((pr) => {
        if (!Array.isArray(pr.pagos) || pr.pagos.length === 0) {
          const pendientes = movs.filter(
            (m) => m.presupuestoId === pr.id && m.tipo === 'ingreso' && !m.anulado && !m.pagoId
          );
          if (!Array.isArray(pr.pagos)) pr.pagos = [];
          pendientes.forEach((m) => {
            const id = 'pg-' + String(m.id).replace(/^mov-/, '');
            m.pagoId = id;
            pr.pagos.push({
              id,
              fecha: m.fecha,
              metodo: m.metodo,
              montoCent: aCent(m.monto),
              costoCent: aCent(m.costoInsumos),
              nota: 'Migrado desde Caja',
              movId: m.id
            });
          });
        }
        if (!(Number(pr.cuotas) >= 1)) pr.cuotas = 1;
      });
      return st;
    }

    function urlImagenSegura(u) {
      if (typeof u !== 'string') return '';
      const limpio = u.trim();
      return /^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/i.test(limpio) ? limpio : '';

// 2. Caché de Blob URLs en memoria y visor de foto ampliada
    const _cacheBlobUrls = new Map();

    function srcFotoRapida(dataUrl) {
      const limpia = urlImagenSegura(dataUrl);
      if (!limpia) return '';
      if (_cacheBlobUrls.has(limpia)) return _cacheBlobUrls.get(limpia);
      try {
        const [meta, b64] = limpia.split(',');
        const mime = meta.match(/:(.*?);/)[1];
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: mime }));
        _cacheBlobUrls.set(limpia, url);
        return url;
      } catch (_) {
        return limpia;
      }
    }

    function limpiarCacheFotos() {

function validarRespaldoImportado(d) {
  const idValido = (v) => v === undefined || v === null || v === '' || /^[\w-]{1,64}$/.test(String(v));
  if ((d.pacientes || []).some((p) => !idValido(p.id))) return 'ID de paciente inválido.';
  if ((d.turnos || []).some((t) => !idValido(t.id) || !idValido(t.pacId))) return 'ID de turno inválido.';
  if ((d.presupuestos || []).some((pr) => !idValido(pr.id) || !idValido(pr.pacId) || (pr.pagos || []).some((pg) => !idValido(pg.id) || !idValido(pg.movId)))) {
    return 'ID de presupuesto o pago inválido.';
  }
  if ((d.historias || []).some((h) => !idValido(h.id) || !idValido(h.pacId))) return 'ID de historia clínica inválido.';
  if ((d.cajaMovimientos || []).some((m) => !idValido(m.id) || !idValido(m.pacId) || !idValido(m.presupuestoId) || !idValido(m.pagoId))) {
    return 'ID de movimiento de caja inválido.';
  }
  if ((d.inventario || []).some((i) => !idValido(i.id))) return 'ID de inventario inválido.';
  if ((d.config?.customSections || []).some((cs) => !idValido(cs.id))) return 'ID de sección personalizada inválido.';
  if ((d.tools || []).some((t) => !idValido(t.id))) return 'ID de tratamiento/herramienta inválido.';
  if ((d.wppConfig?.reglasBot || []).some((r) => !idValido(r.id))) return 'ID de regla de bot inválido.';
  if (d.fotosDentales && typeof d.fotosDentales === 'object') {
    for (const [pacId, lista] of Object.entries(d.fotosDentales)) {
      if (!idValido(pacId)) return 'ID de paciente en fotos inválido.';
      if (Array.isArray(lista) && lista.some((f) => !idValido(f?.id))) return 'ID de foto dental inválido.';
    }
  }
  return '';
}

function abrirIndexedDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB no soportado'));
        const req = indexedDB.open(IDB_NAME, 2);
        req.onupgradeneeded = (ev) => {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
          if (!db.objectStoreNames.contains('fs_handles')) db.createObjectStore('fs_handles');
        };
        req.onblocked = () => reject(new Error('Base de datos bloqueada por otra pestaña'));
        req.onsuccess = (ev) => {
          idbInstancia = ev.target.result;
          idbInstancia.onversionchange = () => idbInstancia.close();
          idbDisponible = true;
          resolve(idbInstancia);
        };
        req.onerror = (ev) => reject(ev.target.error || new Error('Error abriendo IndexedDB'));
      });
    }

    function leerEstadoIDB() {
      return new Promise((resolve, reject) => {
        if (!idbInstancia) return resolve(null);
        const tx = idbInstancia.transaction(IDB_STORE, 'readonly');
        const store = tx.objectStore(IDB_STORE);
        const req = store.get(IDB_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    function escribirEstadoIDB(dataObj) {
      return new Promise((resolve, reject) => {
        if (!idbInstancia) return reject(new Error('IDB no inicializado'));
        const tx = idbInstancia.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.put(dataObj, IDB_KEY);
        req.onsuccess = () => resolve(true);
        req.onerror = () => reject(req.error);
      });
    }

    // =========================================================================
    // COMPRESIÓN INTELIGENTE DE IMÁGENES (REDUCE ~88% SIN PERDER NITIDEZ CLÍNICA)
    // =========================================================================
    function comprimirImagenArchivo(file, opciones = {}) {
      const maxDim = opciones.maxDim || 1440;
      const calidad = opciones.calidad || 0.80;
      const preservarTransparencia = Boolean(opciones.preservarTransparencia);
      const maxBytes = opciones.maxBytes || 15 * 1024 * 1024;

      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          return reject(new Error('Archivo no es una imagen válida'));
        }
        if (file.size > maxBytes) {
          const pesoMB = (file.size / (1024 * 1024)).toFixed(1);
          const maxMB = Math.round(maxBytes / (1024 * 1024));
          alertMsg(`La imagen "${file.name}" (${pesoMB} MB) supera el máximo permitido de ${maxMB} MB.`, true);
          return reject(new Error(`La imagen excede el tamaño máximo de ${maxMB} MB`));
        }
        if (file.type === 'image/svg+xml') {
          const rSvg = new FileReader();
          rSvg.onload = (ev) => resolve({ dataUrl: ev.target.result, ahorroPct: 0 });
          rSvg.onerror = reject;
          rSvg.readAsDataURL(file);
          return;
        }

        const reader = new FileReader();
        reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
        reader.onload = (ev) => {
          const originalDataUrl = ev.target.result;
          const img = new Image();
          img.onerror = () => {
            alertMsg(`No se pudo procesar "${file.name}": formato no soportado o archivo corrupto.`, true);
            reject(new Error('Imagen corrupta o formato no soportado'));
          };
          img.onload = () => {
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (w > maxDim || h > maxDim) {
              if (w >= h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            if (!preservarTransparencia) {
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, w, h);
            }
            ctx.drawImage(img, 0, 0, w, h);
            const mimeOut = preservarTransparencia && file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            const comprimida = mimeOut === 'image/png' ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', calidad);
            const finalUrl = comprimida.length < originalDataUrl.length ? comprimida : originalDataUrl;
            const ahorroPct = Math.max(0, Math.round((1 - finalUrl.length / originalDataUrl.length) * 100));
            resolve({ dataUrl: finalUrl, ahorroPct });
          };
          img.src = originalDataUrl;
        };
        reader.readAsDataURL(file);
      });
    }

    function formatearSegundosCronometro(segTotal) {
      const s = Math.max(0, Math.floor(segTotal));
      const hh = Math.floor(s / 3600);
      const mm = Math.floor((s % 3600) / 60);
      const ss = s % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return hh > 0 ? `${pad(hh)}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`;
    }

    function horaAMinutos(hhmm) {
      const [h, m] = String(hhmm || '09:00').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function sumarMinutosHora(hhmm, mins) {
      const tot = Math.max(0, Math.min(23 * 60 + 59, horaAMinutos(hhmm) + mins));
      const h = Math.floor(tot / 60);
      const m = tot % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function buscarSolapamientoTurno(fecha, horaIni, horaFin, ignorarId = null) {
      const ini = horaAMinutos(horaIni);
      const fin = horaAMinutos(horaFin);
      return state.turnos.find((t) => {
        if (t.id === ignorarId || t.fecha !== fecha || t.estado === 'Cancelado') return false;
        const tIni = horaAMinutos(t.hora);
        const tFin = horaAMinutos(t.horaFin || sumarMinutosHora(t.hora, 45));
        return ini < tFin && fin > tIni;
      });
    }

    function sugerirProximoHorarioLibre(fecha, duracionMin = 45) {
      for (const h of FRANJAS) {
        const hFin = sumarMinutosHora(h, duracionMin);
        if (!buscarSolapamientoTurno(fecha, h, hFin)) return { hora: h, horaFin: hFin };
      }
      return null;
    }

    function formatearDocumentoUY(val) {
      const dig = String(val || '').replace(/\D/g, '').slice(0, 8);
      if (!dig) return '';
      if (dig.length <= 1) return dig;
      const cuerpo = dig.slice(0, -1);
      const dv = dig.slice(-1);
      const cuerpoFmt = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${cuerpoFmt}-${dv}`;
    }

    function formatearTelefonoUY(val) {
      let dig = String(val || '').replace(/\D/g, '');
      if (dig.startsWith('598') && dig.length >= 11) {
        dig = '0' + dig.slice(3);
      }
      dig = dig.slice(0, 9);
      if (dig.length <= 3) return dig;
      if (dig.length <= 6) return `${dig.slice(0, 3)} ${dig.slice(3)}`;
      return `${dig.slice(0, 3)} ${dig.slice(3, 6)} ${dig.slice(6)}`;
    }

    function telefonoAWhatsAppIntl(tel) {
      const dig = String(tel || '').replace(/\D/g, '');
      if (dig.length === 9 && dig.startsWith('09')) {
        return '598' + dig.slice(1);
      }
      return dig;
    }

    function calcularIndiceCPOD(pacId) {
      const od = state.odontogramas[pacId] || {};
      let c = 0, p = 0, o = 0;
      const lista = denticionModo === 'infantil' ? TODAS_PIEZAS_INFANTIL : TODAS_PIEZAS;
      lista.forEach((num) => {
        const d = od[num];
        if (!d) return;
        const valsCaras = Object.values(d.caras || {});
        if (d.pieza === 'extraccion') p++;
        else if (valsCaras.includes('caries')) c++;
        else if (valsCaras.includes('resina') || valsCaras.includes('sellante') || d.pieza === 'corona') o++;
      });
      return { c, p, o, total: c + p + o };
    }

    function aplicarToolEnPiezaIndividual(pacId, numPieza, cara, tool, forzarActivar = false) {
      if (!state.odontogramas[pacId][numPieza]) {
        state.odontogramas[pacId][numPieza] = { pieza: 'sano', raiz: 'sana', caras: { V: 'limpiar', O: 'limpiar', L: 'limpiar', M: 'limpiar', D: 'limpiar' } };
      }
      const diente = state.odontogramas[pacId][numPieza];
      if (tool.tipo === 'limpiar') {
        diente.caras = { V: 'limpiar', O: 'limpiar', L: 'limpiar', M: 'limpiar', D: 'limpiar' };
        diente.pieza = 'sano';
        diente.raiz = 'sana';
      } else if (cara === 'RAIZ' || tool.id === 'endodoncia' || tool.id === 'implante') {
        diente.pieza = !forzarActivar && diente.pieza === tool.id ? 'sano' : tool.id;
        diente.raiz = diente.pieza === tool.id ? tool.id : 'sana';
      } else if (tool.tipo === 'pieza') {
        diente.pieza = !forzarActivar && diente.pieza === tool.id ? 'sano' : tool.id;
      } else {
        diente.caras[cara] = !forzarActivar && diente.caras[cara] === tool.id ? 'limpiar' : tool.id;
      }
    }

    function pintarCaraOdonto(pieza, cara) {
      const pac = getPacienteActivo();
      if (!pac) return;
      if (!state.odontogramas[pac.id]) state.odontogramas[pac.id] = crearOdontoVacio();
      const tool = state.tools.find((t) => t.id === toolActivaId) || state.tools[0];

      if (alcanceOdonto === 'boca') {
        const listaArcada = denticionModo === 'infantil' ? TODAS_PIEZAS_INFANTIL : TODAS_PIEZAS;
        const caraAplicar = tool.tipo === 'cara' ? (cara || 'O') : 'O';
        listaArcada.forEach((numP) => {
          aplicarToolEnPiezaIndividual(pac.id, numP, caraAplicar, tool, true);
        });
        alertMsg(`Aplicado "${tool.nombre}" en toda la boca (${listaArcada.length} piezas).`);
      } else {
        aplicarToolEnPiezaIndividual(pac.id, pieza, cara, tool, false);
        piezaSelectorFDI = pieza;
        if (cara !== 'RAIZ') caraSelectorFDI = cara;
      }
      save();
      render();
    }

    function obtenerHallazgosPaciente(pacId) {
      const od = state.odontogramas[pacId] || {};
      const res = [];
      // IDs que son solo hallazgos clínicos (no se cobran como tratamiento)
      const SOLO_HALLAZGOS = ['caries', 'fractura', 'ausente', 'existente'];

      [...TODAS_PIEZAS, ...TODAS_PIEZAS_INFANTIL].forEach((num) => {
        const d = od[num];
        if (!d) return;
        if (d.pieza && d.pieza !== 'sano' && !SOLO_HALLAZGOS.includes(d.pieza)) {
          const t = state.tools.find((x) => x.id === d.pieza);
          if (t) {
            res.push({
              pieza: `Pieza ${num}`,
              num,
              desc: `${t.nombre} — Pieza / Raíz`,
              toolId: t.id,
              color: t.color,
              cant: 1,
              precio: t.precio
            });
          }
        }
        const grp = {};
        Object.entries(d.caras || {}).forEach(([c, cid]) => {
          if (cid && cid !== 'limpiar') (grp[cid] = grp[cid] || []).push(c);
        });
        Object.entries(grp).forEach(([cid, cs]) => {
          // Si el doctor marcó "caries", sugiere "resina" como tratamiento; si marcó algo existente, no lo cobra
          if (cid === 'existente') return;
          const toolTratamientoId = cid === 'caries' ? 'resina' : cid;
          if (SOLO_HALLAZGOS.includes(toolTratamientoId)) return;
          const t = state.tools.find((x) => x.id === toolTratamientoId);
          if (t) {
            const detalleCaras = cs.map((c) => `${c} (${CARAS_MAP[c]})`).join(', ');
            const motivo = cid === 'caries' ? ' (por caries detectada)' : '';
            res.push({
              pieza: `Pieza ${num} (${cs.join(',')})`,
              num,
              desc: `${t.nombre}${motivo} — Cara ${detalleCaras}`,
              toolId: t.id,
              color: t.color,
              cant: cs.length,
              precio: t.precio
            });
          }
        });
      });
      return res;
    }

async function transferirAPresupuesto() {
      const pac = getPacienteActivo();
      if (!pac) return;
      const hallazgos = obtenerHallazgosPaciente(pac.id);

        alertMsg('Marca primero al menos un tratamiento planificado en el odontograma.', true);

      const nuevosItems = hallazgos.map((h) => {

        const recetaClon = (tool?.receta || []).map((r) => ({

          cant: r.cant * h.cant,

        }));
        return {

          insumos: recetaClon
        };
      });

      const existente = state.presupuestos.find((p) => p.pacId === pac.id && p.estado === 'Pendiente');

          });

        }
        // Conserva ítems manuales y reemplaza solo los que venían del odontograma
        const clavesOdonto = new Set(nuevosItems.map((n) => `${n.pieza}|${n.toolId}`));
	const manuales = (existente.items || []).filter((it) => {
 	if (it.origen === 'odontograma') return false;
	if (!it.origen && clavesOdonto.has(`${it.pieza}|${it.toolId}`)) return false;
  	return true;
});
        existente.items = [...manuales, ...nuevosItems];
        existente.fecha = hoyISO();
        presupuestoId = existente.id;
        vista = 'presupuestos';
        save();
        alertMsg(`Presupuesto ${existente.num} actualizado conservando ítems manuales.`);
        render();
        return;
      }

      const nuevo = {
        id: idUnico('pr'),
        num: generarNumeroPresupuesto(),
        pacId: pac.id,
        fecha: hoyISO(),
        validez: '15 días',
        formaPago: 'Contado o cuotas sin recargo',
        diagnosticoPlan: 'Plan generado desde tratamientos del Odontograma FDI.',
        observaciones: '',
        estado: 'Pendiente',
        estadoClinico: 'Planificado',
        descTipo: 'porcentaje',
        descVal: 0,
        cuotas: 1,
        stockDescontado: false,
        pagos: [],
        items: nuevosItems
      };
      state.presupuestos.unshift(nuevo);
      presupuestoId = nuevo.id;
      vista = 'presupuestos';
      save();
      alertMsg(`Presupuesto ${nuevo.num} creado correctamente.`);
      render();
    }

    // =========================================================================
    // GRÁFICOS VECTORIALES ANATÓMICOS DE ALTA DEFINICIÓN PARA EL PRESUPUESTO
    // =========================================================================
   function renderEsquemaArcadasSVG(pacId, presupuesto) {
      const odonto = state.odontogramas[pacId] || {};
      const mapaAfectados = {};
      const esPresupuestoRealizado = false;
      const tieneTemporal = Object.keys(odonto).some((k) => Number(k[0]) >= 5 && (odonto[k].pieza !== 'sano' || Object.values(odonto[k].caras || {}).some((c) => c !== 'limpiar')));
const usarInfantil = tieneTemporal || denticionModo === 'infantil';
const listaActiva = usarInfantil ? TODAS_PIEZAS_INFANTIL : TODAS_PIEZAS;

      const itemsConPiezaFDI = (presupuesto?.items || []).filter((it) => /\b([1-8][1-8])\b/.test(String(it.pieza || '')));

      // 1. Cargar primero todos los hallazgos registrados en el odontograma del paciente
      listaActiva.forEach((num) => {
        const d = odonto[num];
        if (!d) return;
        const carasMap = {};
        Object.entries(d.caras || {}).forEach(([c, cid]) => {
          if (cid && cid !== 'limpiar') {
            const t = state.tools.find((x) => x.id === cid);
            if (t) carasMap[c] = t.color;
          }
        });
        const tienePieza = d.pieza && d.pieza !== 'sano';
        const tieneCaras = Object.keys(carasMap).length > 0;
        if (tienePieza || tieneCaras) {
          const toolPieza = tienePieza ? state.tools.find((x) => x.id === d.pieza) : null;
          const primerColorCara = Object.values(carasMap)[0];
          mapaAfectados[num] = {
            piezaId: tienePieza ? d.pieza : null,
            color: toolPieza?.color || primerColorCara || '#ef4444',
            caras: carasMap,
            realizado: esPresupuestoRealizado
          };
        }
      });

      // 2. Superponer / agregar los tratamientos incluidos en el presupuesto actual
      (presupuesto?.items || []).forEach((it) => {
        const m = String(it.pieza || '').match(/\b([1-8][1-8])\b/);
        if (m) {
          const num = m[1];
          const tool = state.tools.find((t) => t.id === it.toolId);
          const prev = mapaAfectados[num] || { piezaId: null, caras: {} };
          const mCaras = String(it.pieza || '').match(/\(([VOLMD,\s]+)\)/i);
          if (mCaras) {
            mCaras[1].split(',').forEach((c) => {
              const ck = c.trim().toUpperCase();
              if (ck) prev.caras[ck] = tool?.color || '#ef4444';
            });
          } else if (tool?.tipo === 'pieza') {
            prev.piezaId = tool.id;
          }
          mapaAfectados[num] = {

      if (!pr || !pr.items[idx]) return;
      if (campo === 'precio') {
        pr.items[idx].precio = Math.max(0, Number(valor) || 0);

function generarNumeroPresupuesto() {
      const anio = new Date().getFullYear();
      if (!state.config.contadoresPresupuesto) state.config.contadoresPresupuesto = {};
      // Calcula el mayor número existente este año para no pisar ninguno
      const maxExistente = (state.presupuestos || []).reduce((max, p) => {
        const m = String(p.num || '').match(new RegExp(`^PRES-${anio}-(\\d+)$`));
        return m ? Math.max(max, Number(m[1])) : max;
      }, 0);
      const siguiente = Math.max(Number(state.config.contadoresPresupuesto[anio]) || 0, maxExistente) + 1;
      state.config.contadoresPresupuesto[anio] = siguiente;
      return `PRES-${anio}-${String(siguiente).padStart(3, '0')}`;
    }

    function addItemPres(pieza, desc, precio, toolId = 'resina') {
      const pr = state.presupuestos.find((p) => p.id === presupuestoId);
      if (!pr) return;
      const tool = state.tools.find((t) => t.id === toolId) || state.tools[1];
      const insumos = (tool?.receta || []).map((r) => ({ ...r }));
      pr.items.push({ pieza, desc, toolId: tool?.id || 'resina', realizado: false, cant: 1, precio: Number(precio) || 0, insumos });
      pr.stockDescontado = false;

    function addItemCustom(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const desc = String(fd.get('desc') || '').trim();
      if (!desc) return;
      const toolId = String(fd.get('toolId') || 'resina');
      const tool = state.tools.find((t) => t.id === toolId);
      const precioIngresado = Number(fd.get('precio'));
      const precioFinal = precioIngresado > 0 ? precioIngresado : tool?.precio || 0;
      const piezaBase = String(fd.get('pieza') || 'General').trim() || 'General';
      const caraSel = String(fd.get('cara') || '').trim();
      const piezaFmt = caraSel && !piezaBase.includes('(') ? `${piezaBase} (${caraSel})` : piezaBase;
      addItemPres(piezaFmt, desc, precioFinal, toolId);
      e.target.reset();

    function cambiarTratamientoDeItem(itemIdx, nuevoToolId) {
      const pr = state.presupuestos.find((p) => p.id === presupuestoId);
      if (!pr || !pr.items[itemIdx]) return;
      const tool = state.tools.find((t) => t.id === nuevoToolId);
      if (!tool) return;
      const item = pr.items[itemIdx];
      item.toolId = tool.id;
      item.precio = tool.precio;
      item.insumos = (tool.receta || []).map((r) => ({
        codigo: r.codigo,
        nombre: r.nombre,
        cant: r.cant * item.cant,
        costoUnit: r.costoUnit
      }));
      pr.stockDescontado = false;
      save();
      render();
    }

    function cambiarCantidadItemPres(itemIdx, nuevaCant) {
      const pr = state.presupuestos.find((p) => p.id === presupuestoId);
      if (!pr || !pr.items[itemIdx]) return;
      const item = pr.items[itemIdx];
      const prevCant = Math.max(1, item.cant || 1);
      const nextCant = Math.max(1, Number(nuevaCant) || 1);
      const factor = nextCant / prevCant;
      item.cant = nextCant;
      (item.insumos || []).forEach((ins) => {
        ins.cant = Math.max(1, Math.round(ins.cant * factor * 100) / 100);
      });
      pr.stockDescontado = false;
      save();
      render();
    }

    function agregarInsumoATratamiento(e, itemIdx) {
      e.preventDefault();
      const pr = state.presupuestos.find((p) => p.id === presupuestoId);
      if (!pr || !pr.items[itemIdx]) return;
      const fd = new FormData(e.target);
      const val = String(fd.get('insumoSel') || '');
      const cant = Math.max(0.5, Number(fd.get('cant')) || 1);
      if (!val) return;
      const [origen, idxStr] = val.split(':');
      const idx = Number(idxStr);
      let elegido = null;
      if (origen === 'inv') elegido = state.inventario[idx];
      else if (origen === 'xls') elegido = state.excelTabla?.filas?.[idx];
      if (!elegido) return;

      if (!pr.items[itemIdx].insumos) pr.items[itemIdx].insumos = [];
      pr.items[itemIdx].insumos.push({
        codigo: elegido.codigo || 'MAT',
        nombre: elegido.nombre,
        cant,
        costoUnit: Number(elegido.costoUnit) || 0
      });
      pr.stockDescontado = false;
      save();
      render();
    }

    function eliminarInsumoDeTratamiento(itemIdx, insIdx) {
      const pr = state.presupuestos.find((p) => p.id === presupuestoId);
      if (!pr || !pr.items[itemIdx]) return;
      pr.items[itemIdx].insumos.splice(insIdx, 1);
      pr.stockDescontado = false;
      save();
      render();
    }

    function descontarTodosInsumosPresupuesto() {
      const pr = state.presupuestos.find((p) => p.id === presupuestoId);
      if (!pr) return;
      let descontados = 0;
      (pr.items || []).forEach((it) => {
        (it.insumos || []).forEach((ins) => {
          const invItem = state.inventario.find(
            (x) =>
              (ins.codigo && x.codigo.toLowerCase() === ins.codigo.toLowerCase()) ||
              x.nombre.toLowerCase().includes(ins.nombre.toLowerCase().slice(0, 12))
          );
          if (invItem) {
            invItem.stock = Math.max(0, Math.round((invItem.stock - ins.cant) * 100) / 100);
            descontados++;
          }
        });
      });
      pr.stockDescontado = true;
      addLog(`Stock descontado automáticamente desde ${pr.num} (${descontados} registros)`);
      save();
      alertMsg(`Materiales descontados automáticamente del inventario (${descontados} movimientos).`);
      render();
    }

    async function construirBlobPDFPresupuesto(tarjetaPres, nombreArchivoPDF) {
      const original = tarjetaPres || document.getElementById('presupuesto-imprimible-card');
      if (!original || typeof html2pdf === 'undefined') return null;

      const modalConfirm = document.getElementById('modal-confirm-wpp-pdf');
      const modalEstabaVisible = modalConfirm && !modalConfirm.classList.contains('hidden');
      if (modalEstabaVisible) modalConfirm.classList.add('hidden');

      const prevScrollX = window.scrollX || 0;
      const prevScrollY = window.scrollY || 0;
      window.scrollTo(0, 0);

      const sandbox = document.createElement('div');
      sandbox.id = 'pdf-render-sandbox';
      const clon = original.cloneNode(true);
      clon.id = 'presupuesto-imprimible-clon';
      clon.classList.add('pdf-export-mode');

      clon.querySelectorAll('input, select, textarea').forEach((inp) => {
        if (!inp.classList.contains('no-print')) {
          const span = document.createElement('span');
          span.textContent = inp.tagName === 'SELECT' ? (inp.options[inp.selectedIndex]?.text || inp.value) : inp.value;
          span.className = inp.className.replace(/border[^\s]*|bg-[^\s]*|px-[^\s]*|py-[^\s]*/g, '');
          inp.replaceWith(span);
        }
      });

      clon.querySelectorAll('.no-print').forEach((el) => el.remove());

      clon.querySelectorAll('.hidden').forEach((el) => {
        if (el.className.includes('print:block')) {
          el.classList.remove('hidden');
          el.style.display = 'block';
        } else if (el.className.includes('print:inline')) {
          el.classList.remove('hidden');
          el.style.display = 'inline';
        }
      });

      const mapaPct = Math.max(40, Math.min(100, Number(state.config.mapaScalePres) || 80));
      const mapaW = Math.round(676 * (mapaPct / 100));
      const mapaH = Math.round(308 * (mapaPct / 100));
      clon.style.setProperty('--mapa-pdf-w', mapaW + 'px');
      clon.querySelectorAll('svg.print-svg-mapa').forEach((svg) => {
        svg.setAttribute('width', String(mapaW));
        svg.setAttribute('height', String(mapaH));
        svg.style.width = mapaW + 'px';
        svg.style.height = mapaH + 'px';
        svg.style.maxWidth = mapaW + 'px';
      });

      const logoPx = Math.max(36, Math.min(180, Number(state.config.logoSizePres) || 68));
      clon.querySelectorAll('.pres-logo-custom').forEach((lg) => {
        lg.style.width = logoPx + 'px';
        lg.style.height = logoPx + 'px';
        lg.style.minWidth = logoPx + 'px';
        lg.style.minHeight = logoPx + 'px';
      });

      sandbox.appendChild(clon);
      document.body.appendChild(sandbox);

      await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 80)));

      const opciones = {
        margin:       [6, 6, 6, 6],
        filename:     nombreArchivoPDF || 'presupuesto-odontologico.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          scrollY: 0,
          scrollX: 0,
          x: 0,
          y: 0,
          width: 740,
          windowWidth: 740
        },
        jsPDF:        {
          unit: 'mm',
          format: 'a4',
          orientation: 'portrait'
        },
        pagebreak:    { mode: ['css', 'legacy'], avoid: ['.odontograma-container', '.print-avoid-break', 'tr'] }
      };

try {
        const pdfBlob = await html2pdf().set(opciones).from(clon).outputPdf('blob');
        const dataUri = await new Promise((res) => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.readAsDataURL(pdfBlob);
        });
        const pdfFile = new File([pdfBlob], opciones.filename, { type: 'application/pdf' });
        return { pdfBlob, pdfFile, dataUri };
      } finally {
        sandbox.remove();
        if (modalEstabaVisible) modalConfirm.classList.remove('hidden');
        window.scrollTo(prevScrollX, prevScrollY);
      }
    }

      let enviadoPorApi = false;

      if (state.wppConfig.webhookUrl && state.wppConfig.tokenApi && urlWebhookSegura(state.wppConfig.webhookUrl) && pdfData?.dataUri) {
        try {

            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${state.wppConfig.tokenApi}`
            },
            body: JSON.stringify({
              number: telIntl,
              mediatype: 'document',
              fileName: nombreArchivoPDF,
              caption: txt,
              media: pdfData.dataUri
            })
          });
          if (resp.ok) enviadoPorApi = true;
        } catch (errApi) {
          console.warn('API WhatsApp local no respondió:', errApi);

      }

      if (!enviadoPorApi && pdfData?.pdfFile && navigator.canShare && navigator.canShare({ files: [pdfData.pdfFile] })) {
        try {
          await navigator.share({
            files: [pdfData.pdfFile],
            title: `Presupuesto ${pr.num}`,
            text: txt
          });
          compartidoNativo = true;
        } catch (errShare) {
          console.warn('Compartir nativo cancelado o no disponible:', errShare);
        }
      }

      if (!enviadoPorApi && !compartidoNativo && pdfData?.pdfBlob) {
        const urlBlob = URL.createObjectURL(pdfData.pdfBlob);
        const link = document.createElement('a');
        link.href = urlBlob;
        link.download = nombreArchivoPDF;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(urlBlob), 4000);
      }

      pr.estado = 'Enviado';
      state.chat.push({
        rem: 'bot',
        txt: `${txt}\n\n✅ ${enviadoPorApi ? 'PDF enviado directamente vía API WhatsApp Business.' : compartidoNativo ? 'PDF compartido directamente a WhatsApp.' : 'PDF generado y descargado para adjuntar en WhatsApp.'}`,
        hora: new Date().toTimeString().slice(0, 5),
        turno: null,
        pdfNombre: nombreArchivoPDF
      });

	if (state.cronometroActivo && state.cronometroActivo.pacId === pr.pacId) {
        detenerCronometroAtencion('Presupuesto PDF enviado por WhatsApp');
      }

      addLog(`Presupuesto PDF ${nombreArchivoPDF} enviado por WhatsApp a ${telDestino}`);
      save();
      document.getElementById('modal-confirm-wpp-pdf')?.classList.add('hidden');
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.textContent = '✅ Confirmar y Enviar PDF';

      if (!enviadoPorApi && !compartidoNativo) {
        abrirWhatsAppBusinessReal(telDestino, txt);

      vista = 'whatsapp';
      alertMsg(
        enviadoPorApi
          ? 'PDF enviado correctamente por API WhatsApp Business.'
          : compartidoNativo
          ? 'Archivo PDF compartido con WhatsApp.'
          : `PDF "${nombreArchivoPDF}" descargado. Arrástralo o adjúntalo en la ventana de WhatsApp abierta.`
      );
      render();
    }

function importarTablaExcel(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    alertMsg('Librería Excel no disponible en este navegador.', true);
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const norm = (s) =>
        String(s || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim();
      const numVal = (v, def = 0) => {
        if (typeof v === 'number' && Number.isFinite(v)) return v;
        const n = Number(String(v ?? '').replace(/[^\d.-]/g, ''));
        return Number.isFinite(n) ? n : def;
      };
      const fechaVal = (v) => {
        if (!v) return '';
        if (v instanceof Date && !isNaN(v)) return fechaLocalISO(v);
        if (typeof v === 'number' && v > 20000) {
          const d = new Date(Math.round((v - 25569) * 86400 * 1000));
          return !isNaN(d) ? fechaLocalISO(d) : '';
        }
        return String(v).trim();
      };

      // 1. HOJA INICIO: parámetros de semáforo de vencimiento
      const semaforoCfg = { rojo: 30, naranja: 90, amarillo: 180 };
      const hojaInicioName = wb.SheetNames.find((n) => norm(n).includes('inicio'));
      if (hojaInicioName) {
        const rowsIni = XLSX.utils.sheet_to_json(wb.Sheets[hojaInicioName], { header: 1, defval: '' });
        rowsIni.forEach((r) => {
          const txt = norm(r.join(' '));
          const nums = r.map((c) => numVal(c, NaN)).filter((x) => Number.isFinite(x) && x > 0);
          if (txt.includes('rojo') && nums.length) semaforoCfg.rojo = nums[0];
          if (txt.includes('naranja') && nums.length) semaforoCfg.naranja = nums[0];
          if (txt.includes('amarillo') && nums.length) semaforoCfg.amarillo = nums[0];
        });
      }

      // 2. HOJA INVENTARIO (detecta fila de encabezados automáticamente, ej. fila 4)
      const hojaInvName =
        wb.SheetNames.find((n) => norm(n).includes('inventario')) ||
        wb.SheetNames.find((n) => !norm(n).includes('inicio')) ||
        wb.SheetNames[0];
      const matrixInv = XLSX.utils.sheet_to_json(wb.Sheets[hojaInvName], { header: 1, defval: '' });
      let headerIdx = matrixInv.findIndex((r) => {
        const joined = norm(r.join(' '));
        return (joined.includes('insumo') || joined.includes('material') || joined.includes('nombre')) &&
          (joined.includes('costo') || joined.includes('precio') || joined.includes('stock'));
      });
      if (headerIdx < 0) headerIdx = 0;

      const headers = matrixInv[headerIdx].map((h) => norm(h));
      const colIdx = (regex, fallback = -1) => {
        const i = headers.findIndex((h) => regex.test(h));
        return i >= 0 ? i : fallback;
      };

      const cCod = colIdx(/cod|id|sku/, 0);
      const cNom = colIdx(/insumo|material|nombre|prod|desc/, 1);
      const cCat = colIdx(/cat|tipo|grupo/);
      const cPres = colIdx(/present/);
      const cPrecioEnv = colIdx(/precio.*env|envase/);
      const cUnidEnv = colIdx(/unid.*env|cant.*env/);
      const cUnidad = colIdx(/^unidad$/);
      const cCantUso = colIdx(/cant.*uso|dosis/);
      const cMerma = colIdx(/merma/);
      const cCostoUnid = colIdx(/costo.*unidad/);
      const cRend = colIdx(/rendimiento/);
      const cCostoUso = colIdx(/costo.*uso|costo.*real|costo.*unit|precio.*unit/);
      const cProv = colIdx(/prov/);
      const cStock = colIdx(/stock.*act|^stock$|exist/);
      const cMin = colIdx(/min/);
      const cLote = colIdx(/lote/);
      const cVenc = colIdx(/venc/);
      const cDias = colIdx(/dias/);
      const cSem = colIdx(/semaforo|estado/);
      const cRep = colIdx(/repos/);

      const filasNormalizadas = [];
      for (let r = headerIdx + 1; r < matrixInv.length; r++) {
        const row = matrixInv[r];
        if (!row || !row.length) continue;
        const nombre = String(row[cNom] || '').trim();
        if (!nombre || norm(nombre) === 'total' || norm(nombre).startsWith('subtotal')) continue;

        const codigo = String((cCod >= 0 ? row[cCod] : '') || `XLS-${String(filasNormalizadas.length + 1).padStart(3, '0')}`).trim();
        const categoria = String((cCat >= 0 ? row[cCat] : '') || 'Insumo Excel').trim();
        const presentacion = String(cPres >= 0 ? row[cPres] : '').trim();
        const precioEnvase = cPrecioEnv >= 0 ? numVal(row[cPrecioEnv], 0) : 0;
        const unidadesEnvase = cUnidEnv >= 0 ? numVal(row[cUnidEnv], 1) : 1;
        const unidad = String(cUnidad >= 0 ? row[cUnidad] : 'u.').trim();
        const cantPorUso = cCantUso >= 0 ? numVal(row[cCantUso], 1) : 1;
        const merma = cMerma >= 0 ? numVal(row[cMerma], 0) : 0;
        const costoUnidad = cCostoUnid >= 0 ? numVal(row[cCostoUnid], 0) : 0;
        const rendimiento = cRend >= 0 ? numVal(row[cRend], 0) : 0;

        let costoUnit = cCostoUso >= 0 ? numVal(row[cCostoUso], 0) : 0;
        if (!costoUnit && precioEnvase > 0 && unidadesEnvase > 0) {
          const factorMerma = merma > 0 && merma < 1 ? 1 + merma : merma >= 1 ? 1 + merma / 100 : 1;
          costoUnit = Number(((precioEnvase / unidadesEnvase) * cantPorUso * factorMerma).toFixed(2));
        }

        const proveedor = String((cProv >= 0 ? row[cProv] : '') || 'Excel Vinculado').trim();
        const stock = cStock >= 0 ? numVal(row[cStock], 0) : 10;
        const minimo = cMin >= 0 ? numVal(row[cMin], 3) : 3;
        const lote = String(cLote >= 0 ? row[cLote] : '').trim();
        const vencimiento = cVenc >= 0 ? fechaVal(row[cVenc]) : '';
        const diasVencer = cDias >= 0 && row[cDias] !== '' ? numVal(row[cDias], null) : null;
        let semaforo = String(cSem >= 0 ? row[cSem] : '').trim().toUpperCase();
        if (!semaforo && typeof diasVencer === 'number') {
          semaforo =
            diasVencer < 0
              ? 'VENCIDO'
              : diasVencer < semaforoCfg.rojo
              ? 'ROJO'
              : diasVencer < semaforoCfg.naranja
              ? 'NARANJA'
              : diasVencer <= semaforoCfg.amarillo
              ? 'AMARILLO'
              : 'VERDE';
        }
        const reposicion = String((cRep >= 0 ? row[cRep] : '') || (stock <= minimo ? 'REPONER' : 'OK')).trim();

        const itemObj = {
          codigo,
          nombre,
          categoria,
          presentacion,
          precioEnvase,
          unidadesEnvase,
          unidad,
          cantPorUso,
          merma,
          costoUnidad,
          rendimiento,
          costoUnit,
          proveedor,
          stock,
          minimo,
          lote,
          vencimiento,
          diasVencer,
          semaforo,
          reposicion
        };
        filasNormalizadas.push(itemObj);

        const existente = state.inventario.find(
          (inv) => inv.codigo.toLowerCase() === codigo.toLowerCase() || inv.nombre.toLowerCase() === nombre.toLowerCase()
        );
        if (existente) {
          Object.assign(existente, {
            ...itemObj,
            id: existente.id,
            costoUnit: costoUnit || existente.costoUnit,
            stock: cStock >= 0 ? stock : existente.stock
          });
        } else {
          state.inventario.push({
            id: idUnico('inv'),
            ...itemObj
          });
        }
      }

      // 3. HOJA CUÑAS Y MATRICES
      let cunasData = null;
      const hojaCunasName = wb.SheetNames.find((n) => norm(n).includes('cuna') || norm(n).includes('matriz'));
      if (hojaCunasName) {
        const rowsCunas = XLSX.utils.sheet_to_json(wb.Sheets[hojaCunasName], { header: 1, defval: '' });
        let pacientesMes = 120;
        let opcion1 = 0;
        let opcion2 = 0;
        const itemsCunas = [];

        rowsCunas.forEach((r) => {
          const txt = norm(r.join(' '));
          const nums = r.map((c) => numVal(c, NaN)).filter((x) => Number.isFinite(x) && x > 0);
          if (txt.includes('pacientes') && txt.includes('mes') && nums.length) {
            pacientesMes = nums[nums.length - 1];
          } else if (txt.includes('opcion 1') && nums.length) {
            opcion1 = nums[nums.length - 1];
          } else if (txt.includes('opcion 2') && nums.length) {
            opcion2 = nums[nums.length - 1];
          } else if (r[0] && nums.length >= 2 && !txt.includes('total') && !txt.includes('insumo')) {
            itemsCunas.push({
              nombre: String(r[0]).trim(),
              costo: nums[nums.length - 1]
            });
          }
        });

        const totalMensual = itemsCunas.reduce((s, x) => s + x.costo, 0);
        if (!opcion1 && totalMensual > 0) opcion1 = totalMensual;
        if (!opcion2 && totalMensual > 0 && pacientesMes > 0) {
          opcion2 = Number((totalMensual / pacientesMes).toFixed(2));
        }
        cunasData = { pacientesMes, opcion1, opcion2, items: itemsCunas };
      }

// 4. HOJAS DE ARANCEL (Arancel ejemplo o cualquier copia)
      const arancelesList = [];
      const hojasArancel = wb.SheetNames.filter((n) => norm(n).includes('arancel'));
      hojasArancel.forEach((hName) => {
        const rowsAr = XLSX.utils.sheet_to_json(wb.Sheets[hName], { header: 1, defval: '' });
        let nombreTrat = hName;
        let gastosFijos = 0;
        let horasMes = 0;
        let costoHoraSillon = 0;
        let tiempoMin = 0;
        let costoSillon = 0;
        let costoInsumos = 0;
        let laboratorio = 0;
        let honorario = 0;
        let margenPct = 0;
        let arancelSugerido = 0;
        const insumosReceta = [];

        rowsAr.forEach((r, rIdx) => {
          const c0 = String(r[0] || '').trim();
          const txt = norm(r.join(' '));
          const nums = r.map((c) => numVal(c, NaN)).filter((x) => Number.isFinite(x) && x > 0);
          const ultimoNum = nums.length ? nums[nums.length - 1] : 0;

          if (rIdx === 0 && c0) {
            nombreTrat = c0.replace(/^arancel\s*:\s*/i, '').trim();
          } else if (txt.includes('gastos fijos') && ultimoNum) {
            gastosFijos = ultimoNum;
          } else if (txt.includes('horas clinicas') && ultimoNum) {
            horasMes = ultimoNum;
          } else if (txt.includes('costo por hora') && ultimoNum) {
            costoHoraSillon = ultimoNum;
          } else if (txt.includes('tiempo') && txt.includes('sillon') && nums.length) {
            tiempoMin = nums[0];
            if (nums.length >= 2) costoSillon = ultimoNum;
          } else if (txt.includes('costo') && txt.includes('sillon') && !txt.includes('hora') && ultimoNum) {
            costoSillon = ultimoNum;
          } else if (
            (txt.includes('insumos del tratamiento') || txt.includes('subtotal insumos') || txt.includes('total insumos')) &&
            ultimoNum
          ) {
            costoInsumos = ultimoNum;
          } else if (txt.includes('laboratorio') && ultimoNum) {
            laboratorio = ultimoNum;
          } else if (txt.includes('honorario') && ultimoNum) {
            honorario = ultimoNum;
          } else if (txt.includes('margen') && ultimoNum) {
            margenPct = ultimoNum;
          } else if (txt.includes('arancel sugerido') && ultimoNum) {
            arancelSugerido = ultimoNum;
          } else if (
            c0 &&
            !/^c[oó]digo$/i.test(c0) &&
            nums.length >= 2 &&
            !txt.includes('total') &&
            !txt.includes('subtotal') &&
            !txt.includes('arancel')
          ) {
            const matchInv = state.inventario.find(
              (inv) => inv.codigo.toLowerCase() === c0.toLowerCase() || norm(inv.nombre) === norm(c0)
            );
            if (matchInv || filasNormalizadas.some((f) => f.codigo.toLowerCase() === c0.toLowerCase())) {
              insumosReceta.push({
                codigo: matchInv ? matchInv.codigo : c0,
                nombre: matchInv ? matchInv.nombre : String(r[1] || c0).trim(),
                cant: nums[0] || 1,
                costoUnit: matchInv ? matchInv.costoUnit : ultimoNum
              });
            }
          }
        });

        if (!costoHoraSillon && gastosFijos > 0 && horasMes > 0) {
          costoHoraSillon = Number((gastosFijos / horasMes).toFixed(2));
        }
        if (!costoSillon && costoHoraSillon > 0 && tiempoMin > 0) {
          costoSillon = Number(((costoHoraSillon / 60) * tiempoMin).toFixed(2));
        }
        if (!costoInsumos && insumosReceta.length) {
          costoInsumos = insumosReceta.reduce((s, x) => s + x.cant * x.costoUnit, 0);
        }
        if (!arancelSugerido) {
          const base = costoInsumos + costoSillon + laboratorio + honorario;
          const factor = margenPct > 0 && margenPct < 1 ? 1 + margenPct : margenPct >= 1 ? 1 + margenPct / 100 : 1;
          arancelSugerido = Math.ceil((base * factor) / 10) * 10;
        }

        if (arancelSugerido > 0 || costoInsumos > 0) {
          arancelesList.push({
            hoja: hName,
            nombre: nombreTrat,
            gastosFijos,
            horasMes,
            costoHoraSillon,
            tiempoMin,
            costoSillon,
            costoInsumos,
            laboratorio,
            honorario,
            margenPct,
            arancelSugerido,
            insumos: insumosReceta
          });
        }
      });

      state.excelTabla = {
        nombreArchivo: file.name,
        fechaCarga: hoyISO(),
        hojasLeidas: wb.SheetNames,
        semaforoCfg,
        filas: filasNormalizadas,
        cunas: cunasData,
        aranceles: arancelesList
      };

      addLog(`Excel multi-hoja vinculado: ${file.name} (${filasNormalizadas.length} insumos, ${arancelesList.length} aranceles)`);
      save();
      alertMsg(`Excel sincronizado: ${filasNormalizadas.length} insumos y ${arancelesList.length} arancel(es) cargados.`);
      render();
    } catch (err) {
      console.error(err);
      alertMsg('No se pudo procesar el archivo Excel. Verifica el formato.', true);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function sincronizarArancelATarifario(idx) {
  const ar = state.excelTabla?.aranceles?.[idx];
  if (!ar) return;
  const nombre = String(ar.nombre || ar.hoja || 'Tratamiento Excel').trim();
  const receta = (ar.insumos || []).map((ins) => {
    const inv = state.inventario.find((x) => x.codigo === ins.codigo || x.nombre === ins.nombre);
    return {
      invId: inv ? inv.id : '',
      codigo: ins.codigo,
      nombre: ins.nombre,
      cant: Number(ins.cant) || 1,
      costoUnit: Number(ins.costoUnit) || 0
    };
  });

  const existente = state.tools.find((t) => t.nombre.toLowerCase() === nombre.toLowerCase());
  if (existente) {
    existente.precio = Number(ar.arancelSugerido) || existente.precio;
    if (receta.length) existente.receta = receta;
  } else {
    state.tools.push({
      id: idUnico('tool'),
      nombre,
      tipo: 'pieza',
      precio: Number(ar.arancelSugerido) || 0,
      color: '#0d9488',
      receta
    });
  }
  save();
  alertMsg(`"${nombre}" (${fmtMoney(ar.arancelSugerido)}) enviado al Tarifario y Presupuestos.`);
  render();
}

function borrarItemInventario(idOCodigo) {
  const clave = String(idOCodigo || '').trim();
  if (!clave) return;

  const item = state.inventario.find(
    (x) => String(x.id) === clave || String(x.codigo) === clave
  );
  if (!item) return;

  if (!confirm(`¿Eliminar "${item.nombre}" del inventario?`)) return;

  state.inventario = state.inventario.filter(
    (x) => String(x.id) !== String(item.id)
  );

  if (state.excelTabla && Array.isArray(state.excelTabla.filas)) {
    state.excelTabla.filas = state.excelTabla.filas.filter(
      (f) => String(f.codigo) !== String(item.codigo) && f.nombre !== item.nombre
    );
  }

  save();
  alertMsg(`Insumo "${item.nombre}" eliminado.`);
  render();
}

// 2. Insertar negrita (**texto**) en el textarea de Notas del Dr.
function insertarNegritaNota() {
  const ta = document.querySelector('textarea[name="notasDr"]');
  if (!ta) return;
  const ini = ta.selectionStart;
  const fin = ta.selectionEnd;
  const sel = ta.value.substring(ini, fin) || 'texto importante';
  const reemplazo = `**${sel}**`;
  ta.value = ta.value.substring(0, ini) + reemplazo + ta.value.substring(fin);
  ta.focus();
  ta.setSelectionRange(ini + 2, ini + 2 + sel.length);
}

// 3. Calcular fecha rápida para Recall (+3, +6 o +12 meses)
function setRecallMeses(meses) {
  const inp = document.querySelector('input[name="proximoControl"]');
  if (!inp) return;
  const d = new Date();
  d.setMonth(d.getMonth() + meses);
  inp.value = fechaLocalISO(d);
}

// Obtener pacientes con Recall vencido o próximo (dentro de los próximos 15 días)
function obtenerRecallsPendientes() {
  const hoy = hoyISO();
  const limite = new Date();
  limite.setDate(limite.getDate() + 15);
  const limiteISO = fechaLocalISO(limite);

  const ultimoControlPorPac = {};
  (state.historias || []).forEach((h) => {
    if (h.anulada || !h.proximoControl) return;
    if (!ultimoControlPorPac[h.pacId] || h.fecha > ultimoControlPorPac[h.pacId].fecha) {
      ultimoControlPorPac[h.pacId] = h;
    }
  });

  return Object.values(ultimoControlPorPac)
    .filter((h) => {
      if (h.proximoControl > limiteISO) return false;
      // Ocultar si ya tiene un turno futuro confirmado
      const tieneTurnoFuturo = (state.turnos || []).some(
        (t) => t.pacId === h.pacId && t.estado !== 'Cancelado' && t.fecha >= hoy
      );
      return !tieneTurnoFuturo;
    })
    .map((h) => {
      const pac = state.pacientes.find((p) => p.id === h.pacId);
      return {
        pacId: h.pacId,
        pacNombre: pac?.nombre || 'Paciente',
        tel: pac?.tel || '',
        fechaRecall: h.proximoControl,
        motivoAnterior: h.tipoAtencion || h.diag || 'Control periódico',
        vencido: h.proximoControl < hoy
      };
    })
    .sort((a, b) => a.fechaRecall.localeCompare(b.fechaRecall));
}
function guardarHistoria(e) {
      e.preventDefault();

      const aplicar = (imgData = '', imgNombre = '') => {
        if (editandoHistoriaId) {
          const idx = state.historias.findIndex((x) => x.id === editandoHistoriaId);
          if (idx !== -1 && state.historias[idx].fecha === hoyISO() && !state.historias[idx].anulada) {
            const prev = state.historias[idx];
            const usuarioActual = typeof rolActual === 'string' ? rolActual : state.config.doctor;

            // 1. Guardamos la versión anterior antes de modificarla
            const revisionAnterior = {
              fecha: fechaHoraLocalTexto(),
              usuario: usuarioActual,
              tipoAtencion: prev.tipoAtencion,
              piezasTratadas: prev.piezasTratadas,
              motivo: prev.motivo,
              diag: prev.diag,
              notasDr: prev.notasDr,
              proximoControl: prev.proximoControl
            };

            const historialRevisiones = Array.isArray(prev.revisiones) ? [...prev.revisiones] : [];
            historialRevisiones.push(revisionAnterior);

            // 2. Actualizamos la nota conservando el historial de revisiones[]
            state.historias[idx] = {
              ...prev,
              tipoAtencion: fd.get('tipoAtencion') || 'Consulta Clínica',
              piezasTratadas: fd.get('piezasTratadas') || '',
              motivo: fd.get('motivo'),

              proximoControl: fd.get('proximoControl') || '',
              imgNombre: imgNombre || prev.imgNombre || '',
              imgData: imgData || prev.imgData || '',
              revisiones: historialRevisiones
            };

            editandoHistoriaId = null;
            addLog(`Evolución clínica editada (${prev.fecha}) - Revisión #${historialRevisiones.length}`);
            save();
            alertMsg('Evolución clínica actualizada (versión anterior archivada).');
            render();
            return;

          editandoHistoriaId = null;

        state.historias.unshift({
          id: idUnico('hc'),

        comprimirImagenArchivo(file, { maxDim: 1440, calidad: 0.80 })
          .then(({ dataUrl }) => aplicar(dataUrl, file.name))
          .catch((err) => console.warn('Imagen rechazada en historia clínica:', err));

      }

    const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
    const GCAL_DEF = {
      clientId: '',
      calendarId: 'primary',
      auto: true,
      incluirMotivo: false,
      invitarPaciente: false,
      recordatorioMin: 60,

    };
    let gcalToken = null;
    let gcalTokenExp = 0;
    let gcalSyncing = false;

    const gcalCfg = () => {
      state.gcal = { ...GCAL_DEF, cola: [], ...(state.gcal || {}) };
      if (!Array.isArray(state.gcal.cola)) state.gcal.cola = [];
      return state.gcal;
    };
    const gcalConectado = () => Boolean(gcalToken) && Date.now() < gcalTokenExp - 30000;
    const gcalHoy = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const gcalFin = (t) => t.horaFin || sumarMinutosHora(t.hora, 45);

    function gcalUTC(fecha, hhmm) {
      const [y, m, d] = String(fecha).split('-').map(Number);
      const [h, mi] = String(hhmm || '09:00').split(':').map(Number);
      return new Date(y, m - 1, d, h || 0, mi || 0, 0).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    }

    function gcalTitulo(t) {
      return `🦷 ${t.pacNombre}`;
    }

    function gcalDescripcion(t) {
      const c = gcalCfg();
      const lineas = [state.config.clinica || '', state.config.doctor ? `Profesional: ${state.config.doctor}` : ''];
      if (c.incluirMotivo && t.motivo) lineas.push(`Motivo: ${t.motivo}`);
      lineas.push('Gestionado desde CPFOdonto');
      return lineas.filter(Boolean).join('\n');
    }

    function gcalUrlPlantilla(t) {
      const q = new URLSearchParams({
        action: 'TEMPLATE',
        text: gcalTitulo(t),
        dates: `${gcalUTC(t.fecha, t.hora)}/${gcalUTC(t.fecha, gcalFin(t))}`,
	details: gcalDescripcion(t),
        location: state.config.direccion || '',
        ctz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Montevideo'
      });
      return 'https://calendar.google.com/calendar/render?' + q.toString();
    }

    function icsEscapar(s) {
      return String(s ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/;/g, '\\;')
        .replace(/,/g, '\\,')
        .replace(/\r?\n/g, '\\n');
    }

    function icsLinea(s) {
      const ch = Array.from(s);
      if (ch.length <= 70) return s;
      const out = [ch.slice(0, 70).join('')];
      for (let i = 70; i < ch.length; i += 69) out.push(' ' + ch.slice(i, i + 69).join(''));
      return out.join('\r\n');
    }

    function icsEvento(t) {
      const c = gcalCfg();
      const ahora = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
      const l = [
        'BEGIN:VEVENT',
        `UID:${t.id}@CPFOdonto.local`,
        `DTSTAMP:${ahora}`,
        `DTSTART:${gcalUTC(t.fecha, t.hora)}`,
        `DTEND:${gcalUTC(t.fecha, gcalFin(t))}`,
        `SUMMARY:${icsEscapar(gcalTitulo(t))}`,
        `DESCRIPTION:${icsEscapar(gcalDescripcion(t))}`,
        `LOCATION:${icsEscapar(state.config.direccion || '')}`,
        'STATUS:CONFIRMED'
      ];
      if (Number(c.recordatorioMin) > 0) {
        l.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Recordatorio de turno', `TRIGGER:-PT${Number(c.recordatorioMin)}M`, 'END:VALARM');
      }
      l.push('END:VEVENT');
      return l.map(icsLinea);
    }

    function icsCalendario(turnos) {
      const lineas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//CPFOdonto//Agenda//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
      turnos.forEach((t) => lineas.push(...icsEvento(t)));
      lineas.push('END:VCALENDAR');
      return lineas.join('\r\n') + '\r\n';
    }

    function descargarArchivo(nombre, contenido, mime) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(new Blob([contenido], { type: mime }));
      a.href = url;
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function descargarIcsTurno(id) {
      const t = state.turnos.find((x) => x.id === id);
      if (!t) return;
      descargarArchivo(`Turno_${t.fecha}_${t.hora.replace(':', '')}.ics`, icsCalendario([t]), 'text/calendar;charset=utf-8');
      alertMsg('Archivo .ics descargado. Ábrelo o impórtalo en Google Calendar.');
    }

    function descargarIcsTodos() {
      const hoy = gcalHoy();
      const lista = state.turnos
        .filter((t) => t.estado !== 'Cancelado' && t.fecha >= hoy)
        .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
      if (!lista.length) {
        alertMsg('No hay turnos futuros para exportar.', true);
        return;
      }
      descargarArchivo(`CPFOdonto_Turnos_${hoy}.ics`, icsCalendario(lista), 'text/calendar;charset=utf-8');
      alertMsg(`${lista.length} turno(s) exportados. En Google Calendar: Configuración → Importar y exportar.`);
    }

    function gcalCargarGIS() {
      return new Promise((resolve, reject) => {
        if (window.google?.accounts?.oauth2) return resolve();
        const s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('No se pudo cargar Google (¿sin internet?).'));
        document.head.appendChild(s);
      });
    }

    async function gcalConectar() {
      const c = gcalCfg();
      if (!c.clientId) {
        alertMsg('Primero pega tu Client ID de Google en Admin → Google Calendar.', true);
        vista = 'admin';
        render();
        return;
      }
      if (location.protocol === 'file:') {
        alertMsg('Google no permite iniciar sesión desde un archivo local. Abre la app por http://localhost (ver guía en Admin).', true);
        return;
      }
      try {
        await gcalCargarGIS();
      } catch (e) {
        alertMsg(e.message, true);
        return;
      }
      const cliente = google.accounts.oauth2.initTokenClient({
        client_id: c.clientId,
        scope: GCAL_SCOPE,
        callback: (resp) => {
          if (resp.error) {
            alertMsg('Google: ' + (resp.error_description || resp.error), true);
            return;
          }
          gcalToken = resp.access_token;
          gcalTokenExp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
          alertMsg('Google Calendar conectado.');
          gcalRefrescar();
          gcalSincronizar();
        },
        error_callback: (err) => alertMsg(`No se completó la autorización (${err?.type || 'cancelado'}).`, true)
      });
      cliente.requestAccessToken({ prompt: '' });
    }

    function gcalDesconectar(silencioso = false) {
      const tk = gcalToken;
      gcalToken = null;
      gcalTokenExp = 0;
      if (tk && window.google?.accounts?.oauth2) {
        try {
          google.accounts.oauth2.revoke(tk, () => {});
        } catch (_) {}
      }
      if (!silencioso) {
        alertMsg('Google Calendar desconectado.');
        render();
      }
    }

    async function gcalApi(metodo, ruta, cuerpo) {
      if (!gcalConectado()) throw new Error('NO_AUTH');
      const r = await fetch('https://www.googleapis.com/calendar/v3' + ruta, {
        method: metodo,
        headers: { Authorization: 'Bearer ' + gcalToken, ...(cuerpo ? { 'Content-Type': 'application/json' } : {}) },
        body: cuerpo ? JSON.stringify(cuerpo) : undefined
      });
      if (r.status === 401) {
        gcalToken = null;
        throw new Error('NO_AUTH');
      }
      if (r.status === 204) return null;
      const data = await r.json().catch(() => null);
      if (!r.ok) {
        const err = new Error(data?.error?.message || 'Error HTTP ' + r.status);
        err.status = r.status;
        throw err;
      }
      return data;
    }

    const gcalRutaEventos = (cal) => `/calendars/${encodeURIComponent(cal || 'primary')}/events`;

    function gcalEvento(t) {
      const c = gcalCfg();
      const pac = state.pacientes.find((p) => p.id === t.pacId);
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Montevideo';
      const ev = {
        summary: gcalTitulo(t),
        description: gcalDescripcion(t),
        location: state.config.direccion || '',
        start: { dateTime: `${t.fecha}T${t.hora}:00`, timeZone: tz },
        end: { dateTime: `${t.fecha}T${gcalFin(t)}:00`, timeZone: tz },
        reminders:
          Number(c.recordatorioMin) > 0
            ? { useDefault: false, overrides: [{ method: 'popup', minutes: Number(c.recordatorioMin) }] }
            : { useDefault: true },
        extendedProperties: { private: { CPFOdontoId: t.id } }
      };
      if (c.invitarPaciente && pac?.email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(pac.email)) {
        ev.attendees = [{ email: pac.email, displayName: pac.nombre }];
      }
      return ev;
    }

    async function gcalSyncUno(t) {
      const c = gcalCfg();
      const base = gcalRutaEventos(c.calendarId);
      const ev = gcalEvento(t);
      const q = ev.attendees?.length ? '?sendUpdates=all' : '';
      let res = null;
      if (t.gcalId) {
        try {
          res = await gcalApi('PATCH', `${base}/${encodeURIComponent(t.gcalId)}${q}`, ev);
          if (res?.status === 'cancelled') res = null;
        } catch (e) {
          if (e.status !== 404 && e.status !== 410) throw e;
        }
      }
      if (!res) res = await gcalApi('POST', base + q, ev);
      t.gcalId = res.id;
      t.gcalLink = String(res.htmlLink || '').startsWith('https://') ? res.htmlLink : '';
      t.gcalDirty = false;
      t.gcalError = '';
      if (t.estado === 'Cancelado') {
        gcalEncolarBorrado(t);
      } else if (!state.turnos.includes(t)) {
        c.cola.push({ id: res.id, cal: c.calendarId || 'primary' });
      }
    }

    function gcalEncolarBorrado(t) {
      if (!t || !t.gcalId) return;
      const c = gcalCfg();
      const calDest = c.calendarId || 'primary';
      if (!c.cola.some((x) => x.id === t.gcalId && x.cal === calDest)) {
        c.cola.push({ id: t.gcalId, cal: calDest });
      }
      t.gcalId = '';
      t.gcalLink = '';
      t.gcalDirty = false;
    }

    const gcalPendiente = (t) =>
      t.estado !== 'Cancelado' && ((!t.gcalId && t.fecha >= gcalHoy()) || (t.gcalId && t.gcalDirty));

    const gcalPendientes = () => gcalCfg().cola.length + state.turnos.filter(gcalPendiente).length;

    async function gcalSincronizar(manual = false) {
      const c = gcalCfg();
      if (gcalSyncing || !c.clientId) return;
      if (!gcalConectado()) {
        if (manual) gcalConectar();
        return;
      }
      gcalSyncing = true;
      let ok = 0;
      let borrados = 0;
      let fallos = 0;
      try {
        const colaPendiente = [...c.cola];
        for (const it of colaPendiente) {
          try {
            await gcalApi('DELETE', `${gcalRutaEventos(it.cal)}/${encodeURIComponent(it.id)}`);
          } catch (e) {
            if (e.message === 'NO_AUTH') throw e;
            if (e.status !== 404 && e.status !== 410) {
              fallos++;
              continue;
            }
          }
          c.cola = c.cola.filter((x) => !(x.id === it.id && x.cal === it.cal));
          borrados++;
        }
        if (borrados > 0) save();
        for (const t of state.turnos.filter(gcalPendiente)) {
          try {
            await gcalSyncUno(t);
            ok++;
          } catch (e) {
            if (e.message === 'NO_AUTH') throw e;
            t.gcalError = e.message;
            fallos++;
          }
        }
        c.ultimaSync = fechaHoraLocalTexto();
        save();
        if (ok || borrados || fallos || manual) {
          alertMsg(
            fallos
              ? `Google Calendar: ${ok} sincronizado(s), ${fallos} con error.`
              : `Google Calendar al día (${ok} creado/actualizado, ${borrados} eliminado).`,
            Boolean(fallos)
          );
        }
      } catch (e) {
        save();
        gcalError(e);
      } finally {
        gcalSyncing = false;
        gcalRefrescar();
      }
    }

    function gcalAuto() {
      if (gcalCfg().auto && gcalConectado()) gcalSincronizar();
    }

    function gcalError(e) {
      alertMsg(
        e.message === 'NO_AUTH' ? 'La sesión de Google venció. Pulsa "Conectar con Google" otra vez.' : 'Google Calendar: ' + e.message,
        true
      );
    }

    function gcalRefrescar() {
      const ae = document.activeElement;
      const escribiendo = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      const modal = document.querySelector('[id^="modal-"]:not(.hidden)');
      if (!escribiendo && !modal) render();
    }

    function gcalAccionTurno(id) {
      const t = state.turnos.find((x) => x.id === id);
      if (!t) return;
      const c = gcalCfg();
      if (c.clientId && location.protocol !== 'file:') {
        if (!gcalConectado()) {
          gcalConectar();
          return;
        }
        gcalSyncUno(t)
          .then(() => {
            save();
            alertMsg('Turno agregado a Google Calendar.');
            gcalRefrescar();
          })
          .catch(gcalError);
        return;
      }
      window.open(gcalUrlPlantilla(t), '_blank', 'noopener');
    }

    function guardarGcal(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const c = gcalCfg();
      const nuevoId = String(fd.get('clientId') || '').trim();
      if (nuevoId && !/\.apps\.googleusercontent\.com$/.test(nuevoId)) {
        alertMsg('El Client ID debe terminar en .apps.googleusercontent.com', true);
        return;
      }
      if (nuevoId !== c.clientId) gcalDesconectar(true);
      c.clientId = nuevoId;
      c.calendarId = String(fd.get('calendarId') || '').trim() || 'primary';
      c.recordatorioMin = Math.max(0, Math.min(40320, parseInt(fd.get('recordatorioMin'), 10) || 0));
      c.auto = fd.get('auto') === 'on';
      c.incluirMotivo = fd.get('incluirMotivo') === 'on';
      c.invitarPaciente = fd.get('invitarPaciente') === 'on';
      state.turnos.forEach((t) => {
        if (t.gcalId) t.gcalDirty = true;
      });
      addLog('Configuración de Google Calendar actualizada');
      save();
      alertMsg('Configuración de Google Calendar guardada.');
      render();
    }

        });

    function agregarTratamientoAdmin(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const nombre = String(fd.get('nombre') || '').trim();

    function comprimirDataUrlImagen(dataUrl, maxDim = 1440, calidad = 0.80, preservarTransparencia = false) {
      return new Promise((resolve) => {
        if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image/') || dataUrl.startsWith('data:image/svg+xml')) {
          resolve(dataUrl);
          return;
        }
        const img = new Image();
        img.onerror = () => resolve(dataUrl);
        img.onload = () => {
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (!w || !h) return resolve(dataUrl);
          if (w > maxDim || h > maxDim) {
            if (w >= h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (!preservarTransparencia) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
          }
          ctx.drawImage(img, 0, 0, w, h);
          const mimeOut = preservarTransparencia && dataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';
          const comprimida = mimeOut === 'image/png' ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', calidad);
          resolve(comprimida.length < dataUrl.length ? comprimida : dataUrl);
        };
        img.src = dataUrl;
      });
    }

    async function optimizarFotosExistentes() {
      let procesadas = 0;
      let bytesAntes = 0;
      let bytesDespues = 0;

      for (const pacId of Object.keys(state.fotosDentales || {})) {
        const lista = state.fotosDentales[pacId] || [];
        for (let i = 0; i < lista.length; i++) {
          if (lista[i]?.data?.startsWith('data:image/')) {
            const antes = lista[i].data.length;
            const opt = await comprimirDataUrlImagen(lista[i].data, 1440, 0.78, false);
            lista[i].data = opt;
            bytesAntes += antes;
            bytesDespues += opt.length;
            procesadas++;
          }
        }
      }

      for (let i = 0; i < (state.historias || []).length; i++) {
        const h = state.historias[i];
        if (h?.imgData?.startsWith('data:image/')) {
          const antes = h.imgData.length;
          const opt = await comprimirDataUrlImagen(h.imgData, 1440, 0.78, false);
          h.imgData = opt;
          bytesAntes += antes;
          bytesDespues += opt.length;
          procesadas++;
        }
      }

      if (state.config.logoUrl?.startsWith('data:image/')) {
        const antes = state.config.logoUrl.length;
        const opt = await comprimirDataUrlImagen(state.config.logoUrl, 1440, 0.85, true);
        state.config.logoUrl = opt;
        bytesAntes += antes;
        bytesDespues += opt.length;
        procesadas++;
      }

      if (procesadas === 0) {
        alertMsg('No hay imágenes almacenadas para comprimir.');
        return;
      }

      const ahorroBytes = Math.max(0, bytesAntes - bytesDespues);
      const ahorroMB = (ahorroBytes / (1024 * 1024)).toFixed(2);
      const pct = bytesAntes > 0 ? Math.round((ahorroBytes / bytesAntes) * 100) : 0;

      addLog(`🗜️ Compresión masiva: ${procesadas} imagen(es) optimizadas (-${ahorroMB} MB / ${pct}%)`);
      if (idbDisponible && idbInstancia) {
        await escribirEstadoIDB(JSON.parse(JSON.stringify(state)));
      } else {
        save();
      }
      await actualizarEstadisticasAlmacenamiento();
      render();
      alertMsg(`🗜️ ${procesadas} imagen(es) optimizadas. Ahorro: ${ahorroMB} MB (${pct}% más liviano).`);
    }

    function obtenerRangoFechasCaja(periodo, fechaRefISO) {
      const ref = new Date((fechaRefISO || hoyISO()) + 'T12:00:00');
      if (periodo === 'dia') {
        const d = fechaLocalISO(ref);
        return { inicio: d, fin: d, etiqueta: `Día ${d}` };
      }
      if (periodo === 'semana') {
        const day = ref.getDay();
        const diffLunes = day === 0 ? -6 : 1 - day;
        const lunes = new Date(ref);
        lunes.setDate(ref.getDate() + diffLunes);
        const domingo = new Date(lunes);
        domingo.setDate(lunes.getDate() + 6);
        const ini = fechaLocalISO(lunes);
        const fin = fechaLocalISO(domingo);
        return { inicio: ini, fin: fin, etiqueta: `Semana (${ini} al ${fin})` };
      }
      if (periodo === 'mes') {
        const y = ref.getFullYear();
        const m = String(ref.getMonth() + 1).padStart(2, '0');
        const ultimoDia = new Date(y, ref.getMonth() + 1, 0).getDate();
        return { inicio: `${y}-${m}-01`, fin: `${y}-${m}-${String(ultimoDia).padStart(2, '0')}`, etiqueta: `Mes ${y}-${m}` };
      }
      return { inicio: '0000-01-01', fin: '9999-12-31', etiqueta: 'Histórico Completo' };
    }

      });
